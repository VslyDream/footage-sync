<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="shot-size" content="430x300">
<title>README picture — Main Panel</title>
<!-- Panel and tooltip markup copied from docs/ui/redesign-2026-11/main-panel.html (variant A). Mock data. -->
<link rel="stylesheet" href="badges.css">
<style>
.fs{font-family:"Segoe UI","Source Sans 3",Arial,sans-serif;font-size:13px;color:#e8e8e8}
.fs *{box-sizing:border-box}
.pnl{position:absolute;background:#232323;border:1px solid #0f0f0f;overflow:hidden}
.tabbar{height:24px;background:#1b1b1b;border-bottom:1px solid #2d2d2d;display:flex;align-items:center;padding:0 4px;font-size:11px;color:#d6d6d6;white-space:nowrap;overflow:hidden}
.acts{display:flex;flex-direction:column}
.ma{position:relative;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid transparent;border-radius:4px;background:transparent;flex:none}
.ma.att2{border-color:#c69040;background:#2c251a}
.badge{position:absolute;top:0;right:0;padding:1px 3px;border-radius:7px;background:#30475f;color:#c2dfff;font-size:10px;line-height:1.2;font-weight:700}
.badge.dec{top:auto;bottom:0;right:0;background:#c69040;color:#1c1408}
.sdot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#e0a145}
.tip{position:absolute;left:150px;top:112px;width:260px;background:#f0f0f2;color:#1d1d1f;border-radius:4px;padding:9px 11px;font-size:12px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.tip b{display:block;font-weight:700}
</style>
</head>
<body>
<div class="fs shot" style="width: 430px; height: 300px">
  <div class="pnl" style="left: 16px; top: 6px; width: 54px; height: 288px">
    <div class="tabbar">Footage S</div>
    <div class="acts" style="padding: 3px">
      <button class="ma" aria-label="Links" style="width: 46px; height: 46px; margin-bottom: 2px"><svg aria-hidden="true" width="27" height="27" viewBox="0 0 32 32"><path d="M3 3h18v13H3z M12 16h18v13H12z M12 19l9-9" fill="none" stroke="#bcbec2" stroke-width="1.8"></path></svg></button>
      <button class="ma" aria-label="Sync" style="width: 46px; height: 46px; margin-bottom: 2px"><svg aria-hidden="true" width="27" height="27" viewBox="0 0 32 32"><path d="M25 8a12 12 0 1 1-13-3 M5 4h10v10" fill="none" stroke="#bcbec2" stroke-width="2.4"></path></svg><span class="sdot" aria-hidden="true"></span></button>
      <button class="ma att2" aria-label="Status" style="width: 46px; height: 46px"><svg aria-hidden="true" width="27" height="27" viewBox="0 0 36 36"><path d="M2 18C8 4 28 4 34 18 28 32 8 32 2 18z" fill="none" stroke="#bcbec2" stroke-width="1.8"></path><circle cx="18" cy="18" r="4" fill="#80baff"></circle></svg><span class="badge">34</span><span class="badge dec">3</span></button>
    </div>
  </div>
  <div class="tip" role="tooltip"><b>Status</b>34 changes waiting · 3 need you<br>1 TXT skipped<br><span style="color: #55555b">Sync opens the Changes tab first</span></div>
  <span class="n" style="left: 96px; top: 57px">1</span>
  <span class="n" style="left: 96px; top: 105px">2</span>
  <span class="n" style="left: 96px; top: 153px">3</span>
</div>
</body>
</html>
